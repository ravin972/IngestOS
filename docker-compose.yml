version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ingestos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ingest_os_db
      POSTGRES_USER: ingestos_admin
      POSTGRES_PASSWORD: ingestos_secure_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestos_admin -d ingest_os_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ingestos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
